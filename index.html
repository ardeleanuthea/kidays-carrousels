<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kidays Apps</title>
<link rel="icon" href="assets/logo/logo-kidays-on-light.svg">
<style>
@font-face{font-family:'Poppins';font-weight:500;src:url('assets/fonts/Poppins-Medium.ttf') format('truetype')}
@font-face{font-family:'Poppins';font-weight:700;src:url('assets/fonts/Poppins-Bold.ttf') format('truetype')}
@font-face{font-family:'Poppins';font-weight:800;src:url('assets/fonts/Poppins-ExtraBold.ttf') format('truetype')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(160deg,#27479E 0%,#1E3A8A 45%,#0F172A 100%);color:#1E3A8A;display:flex;align-items:center;justify-content:center;padding:20px}
.login{background:#FAFAFA;border-radius:24px;padding:34px 30px 28px;width:min(400px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login img{height:52px;display:block;margin:0 auto 6px}
h1{font-size:20px;text-align:center;margin:0 0 4px;font-weight:800}
p.s{text-align:center;color:#5E6189;margin:0 0 22px;font-size:13.5px}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5E6189;margin:14px 0 6px}
input[type=text],input[type=password],select{width:100%;border:1px solid #E2E4F0;border-radius:12px;padding:12px 13px;font:inherit;background:#fff;color:#1E3A8A}
input:focus,select:focus{outline:2px solid #1E3A8A}
.chk{display:flex;gap:8px;align-items:center;margin:14px 0 4px;font-size:13px;color:#334155}
button{width:100%;margin-top:18px;border:0;border-radius:12px;padding:13px;font:800 15px 'Poppins',sans-serif;background:#FCD34D;color:#1E3A8A;cursor:pointer;box-shadow:0 12px 24px rgba(252,211,77,.35)}
button:disabled{opacity:.6;cursor:wait}
.err{color:#D93036;font-size:13px;text-align:center;min-height:18px;margin-top:10px}
.note{font-size:11.5px;color:#8A8DAF;text-align:center;margin-top:14px}
</style>
</head>
<body>
<form class="login" id="f" autocomplete="on">
  <img src="assets/logo/logo-kidays-on-light.svg" alt="Kidays">
  <h1>Kidays Apps</h1>
  <p class="s">Carrousels et propositions B2B · équipe Kidays</p>
  <label for="u">Identifiant</label>
  <select id="u" name="username"><option value="equipe">Équipe Kidays</option></select>
  <label for="p">Mot de passe</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="chk"><input type="checkbox" id="keep" checked> Rester connecté sur cet ordinateur</label>
  <button id="go">Entrer</button>
  <div class="err" id="err"></div>
  <div class="note">Mot de passe oublié ? Demandez-le à Thea.</div>
</form>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const ub = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  const KEY = "kdl.session";
  let bundle = null;
  async function getBundle() { if (!bundle) bundle = await (await fetch("app.enc.json", { cache: "no-cache" })).json(); return bundle; }
  async function openWith(masterB64, role) {
    const b = await getBundle();
    const k = await crypto.subtle.importKey("raw", ub(masterB64), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(b.iv) }, k, ub(b.data));
    const app = JSON.parse(new TextDecoder().decode(plain));
    window.KAPP = { role, logout() { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); location.reload(); } };
    document.title = "Kidays Apps";
    document.head.querySelectorAll("style").forEach((s) => s.remove());
    const fonts = document.createElement("link"); fonts.rel = "preload"; fonts.as = "font"; fonts.href = "assets/fonts/Poppins-ExtraBold.ttf"; fonts.crossOrigin = "anonymous"; document.head.appendChild(fonts);
    app.css.forEach((c, i) => { const st = document.createElement("style"); st.id = "kc-css-" + i; st.textContent = c; document.head.appendChild(st); });
    document.body.innerHTML = app.html;
    for (const js of app.js) { const sc = document.createElement("script"); sc.textContent = js; document.body.appendChild(sc); }
  }
  async function unlock(login, pw) {
    const b = await getBundle();
    const slot = b.slots.find((s) => s.login === login); if (!slot) throw new Error("login");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(slot.salt), iterations: b.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(slot.iv) }, k, ub(slot.wrapped));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  // session déjà ouverte ?
  (async () => {
    const saved = localStorage.getItem(KEY) || sessionStorage.getItem(KEY);
    if (!saved) return;
    try { const s = JSON.parse(saved); await openWith(s.key, s.role); } catch (e) { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); }
  })();
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault(); $("#err").textContent = ""; $("#go").disabled = true; $("#go").textContent = "Ouverture…";
    try {
      const s = await unlock($("#u").value, $("#p").value);
      (($("#keep").checked) ? localStorage : sessionStorage).setItem(KEY, JSON.stringify(s));
      await openWith(s.key, s.role);
    } catch (err) {
      $("#err").textContent = "Identifiant ou mot de passe incorrect.";
      $("#go").disabled = false; $("#go").textContent = "Entrer";
    }
  });
})();
</script>
</body>
</html>
